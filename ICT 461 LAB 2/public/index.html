<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTTP Inspector</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #222;
        }

        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
        }

        button:hover {
            background-color: #0056b3;
        }

        pre {
            background: #111827;
            color: #00ff88;
            padding: 15px;
            overflow-x: auto;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>HTTP Inspector</h1>

    <!-- Browser Form -->
    <div class="section">
        <h2>1. Browser Form</h2>

        <form action="/inspect" method="POST">

            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
            >

            <label for="message">Message:</label>
            <input
                type="text"
                id="message"
                name="message"
                placeholder="Enter a message"
            >

            <button type="submit">
                Send Form Request
            </button>

        </form>
    </div>


    <!-- Fetch Request -->
    <div class="section">
        <h2>2. Fetch() Request</h2>

        <label for="method">HTTP Method:</label>

        <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
        </select>

        <label for="fetchMessage">Message:</label>

        <textarea
            id="fetchMessage"
            rows="4"
            placeholder="Enter a message"
        >Hello from fetch()</textarea>

        <button onclick="sendFetchRequest()">
            Send Fetch Request
        </button>
    </div>


    <!-- Response -->
    <div class="section">
        <h2>3. Server Response</h2>

        <pre id="result">
No request sent yet.
        </pre>
    </div>


    <script>

        async function sendFetchRequest() {

            const method =
                document.getElementById("method").value;

            const message =
                document.getElementById("fetchMessage").value;

            try {

                const options = {
                    method: method,
                    headers: {
                        "Content-Type": "application/json",
                        "X-Course": "HTTP-Lab"
                    }
                };

                // GET and DELETE normally do not need a body
                if (method !== "GET" && method !== "DELETE") {

                    options.body = JSON.stringify({
                        message: message
                    });

                }

                const response =
                    await fetch("/inspect", options);

                const data =
                    await response.json();

                document.getElementById("result").textContent =
                    JSON.stringify(data, null, 2);

            } catch (error) {

                document.getElementById("result").textContent =
                    "Error: " + error.message;

            }
        }

    </script>

</body>
</html>
